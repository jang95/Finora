# 운영용 컨테이너 정의 (Phase 7, 결정 D20 — 집 노트북에서 실행)
# 개발용 compose.yaml(DB만)과 별개다. 이름(name)과 volume이 달라서 같은 PC에서 함께 써도 섞이지 않는다.
#
# 처음 배포 / 새 버전 배포 (저장소 루트에서):
#   docker compose -f compose.prod.yaml up -d --build
#   → 이미지 빌드 → db 시작 → migrate(DB 구조 적용 후 종료) → api 시작
# 초대코드 발급 (결정 D14. 출력된 코드는 어디에도 기록하지 않는다):
#   docker compose -f compose.prod.yaml run --rm api invite create
# 로그 보기:  docker compose -f compose.prod.yaml logs -f api
# 중지:       docker compose -f compose.prod.yaml down   (데이터·키는 volume에 남는다)
#
# 값은 같은 폴더의 .env에서 읽는다 (.env.example 참고). .env는 Git에 올리지 않는다.

name: finora-prod

# x-...: compose가 무시하는 이름. 여러 서비스가 같이 쓰는 설정을 한 번만 적는다 (&이름으로 정의, *이름으로 사용)
x-logging: &logging
  # 로그 파일 크기 제한. 오래된 노트북 디스크가 로그로 가득 차지 않게 10MB × 3개까지만 남긴다.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  # 접속 문자열. 호스트 이름 "db" = 아래 db 서비스 (compose가 같은 네트워크의 컨테이너 이름으로 찾아 준다)
  # 환경 변수 이름의 __(밑줄 두 개)는 설정의 :와 같다 → ConnectionStrings:Finora
  ConnectionStrings__Finora: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
  DataProtection__KeysPath: /keys

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # ports가 없다: DB는 노트북 밖(인터넷·집 네트워크)에서 접속할 수 없고, 같은 compose의 api만 접속한다.
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # DB 구조(Migration)를 적용하고 끝나는 1회용 컨테이너 (Data/MigrateCommand.cs)
  migrate:
    build: .
    image: finora-api
    command: ["migrate"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  api:
    image: finora-api
    restart: unless-stopped
    environment:
      <<: *api-environment
      # 프록시(Tailscale)는 노트북에서 127.0.0.1:8080으로 요청을 전달한다.
      # Docker가 그 요청을 컨테이너로 넘길 때 접속 IP가 Docker 내부망 주소(172.x.x.x)로 바뀌므로, 그 범위를 믿을 수 있는 프록시로 추가한다. (7-2)
      ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
    ports:
      # 127.0.0.1: 노트북 자신(Tailscale)만 접속할 수 있다. 집 공유기의 다른 기기에서는 접속되지 않는다.
      - "127.0.0.1:8080:8080"
    volumes:
      # 로그인 Cookie 암호화 키. 컨테이너를 새로 만들어도 키가 남아서 배포 때 로그아웃되지 않는다.
      - dataprotection-keys:/keys
    depends_on:
      # migrate가 성공적으로 끝난 뒤에만 시작한다. 실패하면 api는 뜨지 않는다.
      migrate:
        condition: service_completed_successfully
    logging: *logging

volumes:
  db-data:
  dataprotection-keys:
